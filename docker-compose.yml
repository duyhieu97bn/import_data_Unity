services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: excel-backend
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
    environment:
      - LOCAL_EXCEL_FILE=/app/data/data.xlsx
      - TEMPLATE_FILE=/app/template/template.xlsx
      - USE_LOCAL_FALLBACK=true
      - SHEET1_NAME=Sheet1

  frontend:
    build: ./frontend
    container_name: excel-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://backend:8000

volumes:
  data:
